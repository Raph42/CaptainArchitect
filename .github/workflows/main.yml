name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main, master ] # Se déclenche sur main ou master lors d'un push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Utilisation native du SDK .NET 10

    - name: Publish Application
      run: dotnet publish -c Release -o release

    - name: Adjust base href for GitHub Pages
      # Remplacez NOM_DE_VOTRE_REPO par le nom exact de votre dépôt GitHub
      run: sed -i 's/<base href="\/" \/>/<base href="\/CaptainArchitect\/" \/>/g' release/wwwroot/index.html

    - name: Add .nojekyll file
      # Indispensable pour éviter que GitHub Pages ignore les fichiers commençant par un underscore (comme _framework)
      run: touch release/wwwroot/.nojekyll

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: release/wwwroot

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
